# ForgeOS development/simulator profile
[device]
id=generic-linux
name=Generic Linux SDL device
family=linux-sdl

[ui]
screen_width=640
screen_height=480
screen_bpp=32
fullscreen=0

[storage]
data_root=./runtime/generic-linux
rom_root=${data_root}/roms
home=${data_root}/forgeshell
tool_root=${data_root}/tools

[launcher]
provider=forge-manifest
source=${home}/systems.ini
fallback_command=/bin/true
frontend_value=forgeshell

[maintenance]
manifest=${home}/tools.tsv

[performance]
cpu_helper=

[power]
reboot=/bin/true
poweroff=/bin/true

[input]
up=UP
down=DOWN
left=LEFT
right=RIGHT
accept=RETURN
back=ESCAPE
favorite=SPACE
options=RCTRL
page_left=TAB
page_right=BACKSPACE
start=LALT
select=LCTRL
power=LSHIFT

[capabilities]
battery=0
cpu_profiles=0
brightness=0
volume=0
safe_shutdown=0
storage_health=1
system_info=1
