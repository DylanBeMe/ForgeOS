# ForgeOS development/simulator profile
[device]
id=generic-linux
name=Generic Linux SDL device
family=linux-sdl

[ui]
screen_width=640
screen_height=480
screen_bpp=32
fullscreen=0

[storage]
data_root=./runtime/generic-linux
rom_root=${data_root}/roms
home=${data_root}/forgeshell
tool_root=${data_root}/tools

[launcher]
provider=forge-manifest
source=${home}/systems.ini
fallback_command=/bin/true
frontend_value=forgeshell

[maintenance]
manifest=${home}/tools.tsv

[performance]
cpu_helper=

[power]
reboot=/bin/true
poweroff=/bin/true

[input]
up=UP
down=DOWN
left=LEFT
right=RIGHT
accept=RETURN
back=ESCAPE
favorite=SPACE
options=RCTRL
page_left=TAB
page_right=BACKSPACE
start=LALT
select=LCTRL
power=LSHIFT

[joystick]
enabled=0
device=0
axis_x=0
axis_y=1
axis_threshold=16000
hat=0
up=-1
down=-1
left=-1
right=-1
accept=0
back=1
favorite=2
options=3
page_left=4
page_right=5
start=6
select=7
power=8

[labels]
accept=ENTER
back=ESC
favorite=SPACE
options=RCTRL
page_left=TAB
page_right=BKSP
start=ALT
select=CTRL
power=SHIFT

[capabilities]
battery=0
cpu_profiles=0
brightness=0
volume=0
safe_shutdown=0
storage_health=1
system_info=1
