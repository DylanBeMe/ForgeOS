# ForgeOS platform profile: Powkiddy Q90
[device]
id=q90
name=Powkiddy Q90
family=miyoo

[ui]
screen_width=320
screen_height=240
screen_bpp=16
fullscreen=1

[storage]
data_root=/mnt
rom_root=${data_root}/roms
home=${data_root}/forgeshell
tool_root=${data_root}/apps/forge-tools

[launcher]
provider=gmenu2x
source=${data_root}/gmenu2x/sections/emulators:${data_root}/gmenu2x/sections/cores
fallback_command=${home}/run-gmenu2x.sh
frontend_value=gmenu2x

[maintenance]
manifest=${home}/tools.tsv

[performance]
cpu_helper=${tool_root}/cpu-profile-control.sh

[power]
reboot=/sbin/reboot
poweroff=/sbin/poweroff

[input]
up=UP
down=DOWN
left=LEFT
right=RIGHT
accept=LALT
back=LCTRL
favorite=LSHIFT
options=RETURN
page_left=TAB
page_right=BACKSPACE
start=RETURN
select=RCTRL
power=ESCAPE

[joystick]
enabled=0
device=0
axis_x=0
axis_y=1
axis_threshold=16000
hat=0
up=-1
down=-1
left=-1
right=-1
accept=0
back=1
favorite=2
options=3
page_left=4
page_right=5
start=6
select=7
power=8

[labels]
accept=A
back=B
favorite=X
options=START
page_left=L
page_right=R
start=START
select=SELECT
power=+

[capabilities]
battery=1
cpu_profiles=1
brightness=1
volume=1
safe_shutdown=1
storage_health=1
system_info=1
